name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove passwords, tokens and private addresses before posting.
  - type: input
    id: grafana
    attributes:
      label: Grafana version
      placeholder: "13.3.1"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Beautify Alert version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Email not sent or delivery error
        - Template or preview
        - Setup or contact point
        - Configuration or SMTP
        - Delivery log
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a template with ...
        2. Fire an alert with the labels ...
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Error from the delivery log or Grafana's log
      render: text
  - type: textarea
    id: template
    attributes:
      label: Template (if it is a template problem)
      render: html
